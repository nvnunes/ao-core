site_name: AO Core
site_description: Shared infrastructure for adaptive optics software
repo_name: ao-core
docs_dir: docs
strict: true

theme:
  name: material

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            show_root_heading: true
            show_source: false
            heading_level: 2
            members_order: source

nav:
  - Home: index.md
  - Guides:
      - API: api.md
      - Result I/O: io.md
      - Architecture: architecture.md
      - Development: development.md
      - Testing: testing.md
  - Reference:
      - Python API: reference/api.md
      - HDF5 result format: reference/hdf5.md
